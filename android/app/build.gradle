plugins { id 'com.android.application' }
android {
    namespace 'org.xiao.motion'
    compileSdk 35
    defaultConfig {
        applicationId 'org.xiao.motion'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Public DEVELOPMENT key: local and CI debug APKs can update each other.
    // Never use this debug key for a production/store release.
    signingConfigs { debug {
        storeFile file('../debug.keystore')
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    } }
    buildTypes { debug { debuggable true; minifyEnabled false } }
    lint { abortOnError true }
}
